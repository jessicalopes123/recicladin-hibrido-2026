<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recuperar senha — ReciclaDin</title>
  <link rel="stylesheet" href="../css/style.css?v=20261102-auth-bento-1">
  <link rel="stylesheet" href="../css/auth-theme.css?v=20261102-auth-bento-3">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="../manifest.webmanifest">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <section class="auth-visual">
      <div class="visual-content">
        <div class="eyebrow">🔐 Acesso seguro</div>
        <h1>Recupere seu acesso com segurança.</h1>
        <p>O Supabase envia um link de redefinição para o seu e-mail.</p>
      </div>
    </section>
    <section class="auth-panel">
      <div class="auth-card">
        <a class="brand" href="login.html"><div class="brand-mark">♻</div>ReciclaDin</a>
        <h2>Esqueci minha senha</h2>
        <p class="subtitle">Informe o e-mail usado no cadastro.</p>
        <form id="recovery-form">
          <div class="form-group">
            <label class="label" for="email">E-mail</label>
            <input id="email" class="input" type="email" required autocomplete="email">
          </div>
          <button class="btn btn-primary" type="submit">Enviar link seguro</button>
        </form>
        <div id="recovery-msg" class="notice" role="status" aria-live="polite" style="margin-top:16px"></div>
        <p class="footer-note"><a class="link" href="login.html">Voltar para o login</a></p>
      </div>
    </section>
  </div>
  <script type="module" src="../js/recovery.js?v=20261103-password-recovery-1"></script>
</body>
</html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova senha — ReciclaDin</title><link rel="stylesheet" href="../css/style.css">  <meta name="theme-color" content="#16a34a">
  <link rel="manifest" href="../manifest.webmanifest">
</head><body><div class="auth-shell"><section class="auth-visual"><div class="visual-content"><div class="eyebrow">🔑 Nova senha</div><h1>Crie uma nova senha forte.</h1><p>Não compartilhamos sua senha com a aplicação. A autenticação é gerenciada pelo Supabase Auth.</p></div></section><section class="auth-panel"><div class="auth-card"><div class="brand"><div class="brand-mark">♻</div>ReciclaDin</div><h2>Redefinir senha</h2><form id="new-password-form"><div class="form-group"><label class="label" for="password">Nova senha</label><input id="password" class="input" type="password" required minlength="8" aria-describedby="password-requirements"><ul id="password-requirements" class="password-requirements" aria-label="Requisitos da senha"><li data-password-rule="length">8 caracteres ou mais</li><li data-password-rule="uppercase">Letras maiúsculas</li><li data-password-rule="lowercase">Letras minúsculas</li><li data-password-rule="number">Pelo menos um número</li><li data-password-rule="special">Pelo menos um caractere especial</li></ul></div><div class="form-group"><label class="label" for="confirm">Confirmar nova senha</label><input id="confirm" class="input" type="password" required minlength="8"></div><button class="btn btn-primary">Salvar nova senha</button></form><div id="new-msg" class="notice" style="margin-top:16px"></div></div></section></div><script type="module" src="../js/new-password.js"></script></body></html>
